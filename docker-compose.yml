services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ner_logistics
      POSTGRES_USER: ner_admin
      POSTGRES_PASSWORD: ner_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: