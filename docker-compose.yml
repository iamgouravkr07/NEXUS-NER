services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nexus-ner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_ner
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: